<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางธาตุ - Periodic Table Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sarabun:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background-color: #0f0718;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1025;
        }
        ::-webkit-scrollbar-thumb {
            background: #7c3aed;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6d28d9;
        }

        /* Periodic Grid Layout */
        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, minmax(0, 1fr));
            gap: 4px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            overflow-x: auto; /* Allow horizontal scroll on small screens */
        }

        /* Aspect ratio for grid cells to keep them square-ish */
        .element-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            user-select: none;
        }

        .element-cell:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Category Colors (Border & Background tint) */
        .cat-alkali { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #fca5a5; } /* Red */
        .cat-alkaline-earth { background: rgba(249, 115, 22, 0.15); border-color: #f97316; color: #fdba74; } /* Orange */
        .cat-transition { background: rgba(234, 179, 8, 0.15); border-color: #eab308; color: #fde047; } /* Yellow */
        .cat-post-transition { background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #6ee7b7; } /* Emerald */
        .cat-metalloid { background: rgba(20, 184, 166, 0.15); border-color: #a5ed21; color: #3f9922; } /* Teal */
        .cat-nonmetal { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; color: #93c5fd; } /* Blue */
        .cat-halogen { background: rgba(139, 92, 246, 0.15); border-color: #8b5cf6; color: #c4b5fd; } /* Violet */
        .cat-noble { background: rgba(168, 85, 247, 0.15); border-color: #a855f7; color: #d8b4fe; } /* Purple */
        .cat-lanthanide { background: rgba(236, 72, 153, 0.15); border-color: #ec4899; color: #f9a8d4; } /* Pink */
        .cat-actinide { background: rgba(244, 63, 94, 0.15); border-color: #f43f5e; color: #fda4af; } /* Rose */
        .cat-unknown { background: rgba(71, 85, 105, 0.3); border-color: #475569; color: #cbd5e1; } /* Slate */

        /* Modal Blur */
        .modal-backdrop {
            backdrop-filter: blur(8px);
        }
        
        /* Specific tweaks for text size in cells */
        .atomic-num { font-size: 0.6rem; position: absolute; top: 2px; left: 4px; opacity: 0.7; }
        .symbol { font-size: 1.1rem; font-weight: 700; }
        .name { font-size: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; opacity: 0.9; }

        @media (min-width: 768px) {
            .symbol { font-size: 1.4rem; }
            .name { font-size: 0.65rem; }
            .atomic-num { font-size: 0.75rem; }
        }
    </style>
</head>

        /* Map Category ID to Thai Name */
        const categoryMap = {

            "lanthanide": "แลนทาไนด์ (Lanthanide)",

            "unknown": "สมบัติเคมีไม่ทราบแน่ชัด"
        };

        const grid = document.getElementById('elementsGrid');
        const modal = document.getElementById('elementModal');
        const searchInput = document.getElementById('searchInput');

        function renderElements(data) {
            // Remove existing element-cells (keep the placeholder spacers)
            const existingCells = grid.querySelectorAll('.element-js-item');
            existingCells.forEach(el => el.remove());

            data.forEach(el => {
                const cell = document.createElement('div');
                cell.className = `element-cell element-js-item cat-${el.cat}`;
                
                // --- GRID PLACEMENT LOGIC ---
                // Main Table
                if (el.g && el.p) {
                    cell.style.gridColumn = el.g;
                    cell.style.gridRow = el.p;
                } 
                // Lanthanides (Row 9 in visual grid, standard convention)
                else if (el.cat === 'lanthanide') {
                    // Logic: Lanthanum starts at atomic 57. Place in row 9, starting col 3 (visually aligned)
                    // Actually, usually placed from col 4 to 18, or 3 to 17. 
                    // Let's place them starting col 4 to 18 (15 elements).
                    // Or more commonly: offset 2. 57(La) -> index 0. Col = 3 + 0... wait.
                    // Let's use simpler logic: 57 is La. 
                    const offset = el.n - 57; 
                    cell.style.gridRow = 9; // Spaced out from main table (rows 1-7)
                    cell.style.gridColumn = 3 + offset; // Start aligning under Group 3
                    
                    // Specific fix: if we want them centered or distinct
                    cell.style.marginTop = "20px"; // Visual separation
                }
                // Actinides (Row 10)
                else if (el.cat === 'actinide') {
                    const offset = el.n - 89;
                    cell.style.gridRow = 10;
                    cell.style.gridColumn = 3 + offset;
                    cell.style.marginTop = "20px";
                }

                // Inner HTML
                cell.innerHTML = `
                    <span class="atomic-num">${el.n}</span>
                    <span class="symbol">${el.s}</span>
                    <span class="name">${el.name}</span>
                `;

                cell.onclick = () => openModal(el);
                grid.appendChild(cell);
            });
        }

        function calculateParticles(atomicNumber, massStr) {
            let mass = parseFloat(massStr.replace(/[()]/g, ''));
            let protons = atomicNumber;
            let electrons = atomicNumber; // Neutral atom
            let neutrons = Math.round(mass - protons);
            return { protons, electrons, neutrons };
        }

        function openModal(el) {
            const { protons, electrons, neutrons } = calculateParticles(el.n, el.mass);

            document.getElementById('modalNumber').innerText = el.n;
            document.getElementById('modalSymbol').innerText = el.s;
            document.getElementById('modalName').innerText = el.name;
            document.getElementById('modalNameEn').innerText = el.nameEn;
            document.getElementById('modalCategory').innerText = categoryMap[el.cat] || el.cat;
            document.getElementById('modalMass').innerText = el.mass;
            
            // Logic for discovery (Mock/Simple logic based on atomic number)
            let disc = "ยุคโบราณ";
            if(el.n > 100) disc = "ยุคใหม่ (สังเคราะห์)";
            else if(el.n > 94) disc = "ศตวรรษที่ 20 (สังเคราะห์)";
            else if(el.n > 50) disc = "ศตวรรษที่ 18-19";
            document.getElementById('modalDiscovered').innerText = disc;

            document.getElementById('modalGroup').innerText = el.g ? el.g : "-";
            document.getElementById('modalPeriod').innerText = el.p;

            document.getElementById('modalProton').innerText = protons;
            document.getElementById('modalElectron').innerText = electrons;
            document.getElementById('modalNeutron').innerText = neutrons;

            document.getElementById('modalConfigShort').innerText = el.config;
            document.getElementById('modalConfigFull').innerText = "Electron Config (Full details)"; // Simplified for UI

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
        });

        // Search & Filter
        function filterElements() {
            const query = searchInput.value.toLowerCase();
            const allCells = document.querySelectorAll('.element-js-item');
            
            // To filter in Grid, we can't just hide elements easily without breaking layout flow usually.
            // But since we use specific Grid Column/Row, hiding them (display: none) works fine! 
            // The remaining ones stay in their correct slots.
            
            allCells.forEach(cell => {
                const text = cell.innerText.toLowerCase();
                // We need to match against the data, but cell text is a good proxy
                if (text.includes(query)) {
                    cell.style.display = 'flex';
                    cell.style.opacity = '1';
                } else {
                    cell.style.opacity = '0.1'; // Dim instead of hide to keep table shape? 
                    // Let's try dimming to preserve the table shape context
                }
            });

            if(query === '') {
                 allCells.forEach(cell => {
                    cell.style.opacity = '1';
                    cell.style.display = 'flex';
                 });
            }
        }

        function filterByCategory(cat) {
            const allCells = document.querySelectorAll('.element-js-item');
            allCells.forEach(cell => {
                if (cell.classList.contains(`cat-${cat}`)) {
                    cell.style.opacity = '1';
                    cell.style.transform = 'scale(1.05)';
                    cell.style.zIndex = '5';
                    cell.style.boxShadow = '0 0 10px rgba(255,255,255,0.3)';
                } else {
                    cell.style.opacity = '0.1';
                    cell.style.transform = 'scale(1)';
                    cell.style.zIndex = '1';
                    cell.style.boxShadow = 'none';
                }
            });
        }

        function resetFilter() {
             const allCells = document.querySelectorAll('.element-js-item');
             allCells.forEach(cell => {
                cell.style.opacity = '1';
                cell.style.transform = 'scale(1)';
                cell.style.zIndex = '1';
                cell.style.boxShadow = 'none';
             });
        }

        searchInput.addEventListener('input', filterElements);

        // Init
        renderElements(elementsData);
